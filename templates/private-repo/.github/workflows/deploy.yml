# Deploy to Pi - copy this file to .github/workflows/deploy.yml in your
# PRIVATE settings repository (see README.md next to it). It runs only when
# you start it under Actions > "Deploy to Pi" > Run workflow, on the runner
# that "sudo bash setup.sh runner" installed on the Pi.
name: Deploy to Pi

on:
  workflow_dispatch:
    inputs:
      pi:
        description: 'Which Pi: its runner label (default: its hostname) and its folder under pis/'
        required: true
        default: pi5
      tasks:
        description: 'Tasks to run, space separated. Empty: every task already set up on the Pi'
        required: false
        default: ''
      skip:
        description: 'Tasks to leave out of this run, space or comma separated. Empty: skip none'
        required: false
        default: ''
      branch:
        description: 'Branch of rpi-setup to deploy (must be listed in RUNNER_BRANCHES on the Pi)'
        required: true
        default: main
      settings:
        description: 'Install pis/<pi>/rpi-setup.env from this repository on the Pi first'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.pi }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy rpi-setup to ${{ inputs.pi }}
    runs-on: [self-hosted, '${{ inputs.pi }}']
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy
        env:
          PI: ${{ inputs.pi }}
          TASKS: ${{ inputs.tasks }}
          SKIP: ${{ inputs.skip }}
          BRANCH: ${{ inputs.branch }}
          SETTINGS: ${{ inputs.settings }}
        run: |
          args=(--branch "$BRANCH" --tasks "$TASKS")
          # With an rpi-setup submodule in this repository, deploy exactly the
          # commit it pins (the one its checks tested) instead of the tip of
          # main. A deploy command from before --commit gets the tip once and
          # writes itself again on that run.
          commit="$(git ls-tree HEAD rpi-setup | awk '$1 == "160000" {print $3}')"
          if [ -n "$commit" ] && [ "$BRANCH" = main ]; then
            if grep -q -e '--commit' /usr/local/sbin/rpi-setup-deploy; then
              args+=(--commit "$commit")
            else
              echo "::warning::The deploy command on the Pi predates --commit, so this run deploys the tip of $BRANCH; the next run deploys the submodule's commit."
            fi
          fi
          # Passed only when set, so a Pi whose deploy command predates
          # --skip still runs every other workflow.
          [ -z "$SKIP" ] || args+=(--skip "$SKIP")
          if [ "$SETTINGS" = true ]; then
            test -f "pis/$PI/rpi-setup.env" || { echo "pis/$PI/rpi-setup.env not found in this repository"; exit 1; }
            args+=(--config "$PWD/pis/$PI/rpi-setup.env")
          fi
          sudo -n /usr/local/sbin/rpi-setup-deploy "${args[@]}"

      # The checkout holds your settings; do not leave it in the runner's
      # work folder on the Pi.
      - name: Remove the checkout
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -delete
