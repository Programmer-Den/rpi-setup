name: Virtual Testing Environment

# Docs-only and .claude/ (agent skill) changes cannot affect provisioning, so
# pushes to main skip this workflow. Pull requests always run it, so the
# "Virtual Testing Environment" job at the end can be a required check; on a
# docs-only PR only the quick syntax and unit jobs run, and the nspawn gate
# runs only when a PR touches what it exercises. A push to main and a manual
# run go through every job.
on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*', '.claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: virtual-test-${{ github.ref }}
  # Only cancel superseded PR runs; let pushes to main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  syntax:
    name: Syntax check, lint, and task registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads the commits of the pull request or push.
          fetch-depth: 0

      - name: Validate bash syntax
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            bash -n "$f"
          done
          echo "All shell scripts pass 'bash -n'"

      # shellcheck ships with the hosted runner image.
      - name: Run shellcheck
        run: shellcheck --color=never setup.sh lib/*.sh tasks/*.sh host/*.sh ci/*.sh config/*.sh

      - name: Lint GitHub Actions workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12 -no-color -oneline

      - name: Verify task registry loads
        run: bash setup.sh --list

      # The newest gitleaks release, checked against its published checksums.
      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo gitleaks/gitleaks --json tagName --jq .tagName)"
          file="gitleaks_${tag#v}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          gh release download "$tag" --repo gitleaks/gitleaks --pattern "$file" --pattern "gitleaks_${tag#v}_checksums.txt"
          grep " $file\$" "gitleaks_${tag#v}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Scans the commits of the pull request or push (all of them on a manual
      # run) with .gitleaks.toml and .gitleaksignore.
      - name: No settings, keys or passwords committed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) range="$BASE..$HEAD" ;;
            push) [[ "$BEFORE" =~ ^0+$ ]] && range="$GITHUB_SHA" || range="$BEFORE..$GITHUB_SHA" ;;
            *) range='' ;;
          esac
          gitleaks git --no-banner --redact -v ${range:+--log-opts="$range"}

      - name: Test the gitleaks rules
        run: bash ci/test-no-secrets.sh

  unit:
    name: Unit tests (lib, setup.sh, flash.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test lib/common.sh and host/flash.sh helpers
        run: sudo bash ci/test-lib.sh

      - name: Test setup.sh CLI and menu
        run: sudo bash ci/test-setup.sh

      - name: Test task helpers (ci/test-task-*.sh)
        run: for t in ci/test-task-*.sh; do echo "== $t"; sudo bash "$t"; done

  # Exercises the Docker-based tasks on a plain x86 runner. The nspawn gate
  # cannot run Docker, so without this the compose/UID logic in netalertx and
  # teamspeak would only be tested by the manual QEMU job.
  docker-smoke:
    name: Docker tasks on plain runner
    runs-on: ubuntu-latest
    needs: [syntax, unit, changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision Docker tasks
        env:
          PROVISION_PROFILE: docker
        # The runner's sudo no longer takes -E, so the profile is passed explicitly.
        run: sudo env PROVISION_PROFILE="$PROVISION_PROFILE" bash ci/provision.sh "$GITHUB_WORKSPACE"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-smoke-logs
          path: ci-logs/
          retention-days: 7

  # The <TASK>_DOCKER=yes mode on a plain x86 runner, which has Docker and a
  # booted systemd (the nspawn gate has neither Docker nor a real port 53).
  container-helpers:
    name: Container helpers (lib/containers.sh)
    runs-on: ubuntu-latest
    needs: [syntax, unit, changes]
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test lib/containers.sh
        run: sudo bash ci/test-containers.sh

  # One ci/smoke-container-<task>.sh per task: runs "setup.sh <task>" with
  # <TASK>_DOCKER=yes, checks the service answers, re-runs it and switches back.
  # ci/smoke-container-web-pihole.sh runs between them (glob order) and checks
  # that the web task takes port 80 from a Pi-hole container, moving the
  # admin page to 8080; it needs the Pi-hole image the pihole script pulled
  # and nginx not yet installed, which the web script does last.
  container-smoke:
    name: Container tasks on plain runner
    runs-on: ubuntu-latest
    needs: [container-helpers]
    if: ${{ !cancelled() && needs.container-helpers.result == 'success' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run every ci/smoke-container-*.sh
        run: |
          set -euo pipefail
          for t in ci/smoke-container-*.sh; do
            echo "::group::$t"
            sudo bash "$t"
            echo "::endgroup::"
          done

      - name: Show containers and logs on failure
        if: failure()
        run: |
          sudo docker ps -a || true
          for c in $(sudo docker ps -aq); do
            echo "::group::$(sudo docker inspect -f '{{.Name}}' "$c")"
            sudo docker logs --tail 100 "$c" 2>&1 || true
            echo "::endgroup::"
          done

  # Decides whether the PR touches anything the nspawn gate exercises (provision)
  # and anything besides docs (code). PRs that only change the flasher tests
  # or other workflows skip the gate; docs-only PRs also skip the Docker and
  # container jobs. The filters read the PR's file list, so they only run on
  # a pull request; a push to main or a manual run counts as both changed,
  # and every job runs.
  changes:
    name: Detect provisioning changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      provision: ${{ github.event_name != 'pull_request' || steps.filter.outputs.provision == 'true' }}
      code: ${{ github.event_name != 'pull_request' || steps.code.outputs.code == 'true' }}
    steps:
      # host/flash.sh resolves the gate's "latest" image (prepare-image calls
      # its latest_release); config/ holds the task settings setup.sh splits.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            provision:
              - setup.sh
              - lib/**
              - tasks/**
              - config/**
              - host/flash.sh
              - ci/provision.sh
              - .github/workflows/test-provision.yml
              - .github/actions/**

      # A file counts as code when it matches every pattern here; that
      # quantifier would break the provision filter, hence a second step.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: code
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!.claude/**'

  # Runs on the latest release (what host/flash.sh and host/flash.ps1 write
  # today, resolved at run time) and on Bookworm (what existing Pis still run).
  # Each release runs as two parallel jobs (ci/provision.sh profiles
  # container-system and container-web): package installs under arm64
  # emulation dominate the gate, and splitting them roughly halves wall time.
  provision-gate:
    name: Provision tasks in booted nspawn (PR gate, ${{ matrix.release }}, ${{ matrix.group }})
    # Ubuntu 24.04: newer runner images no longer have qemu-user-static, which
    # pinspawn-action installs when it is missing.
    runs-on: ubuntu-24.04
    needs: [syntax, unit, changes]
    if: needs.changes.outputs.provision == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, latest]
        group: [system, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare Raspberry Pi OS image
        id: image
        uses: ./.github/actions/prepare-image
        with:
          version: ${{ matrix.release }}

      # host/flash.sh and host/flash.ps1 enable SSH and create the login user
      # by writing "ssh" and "userconf.txt" to the boot partition. Fail if a new
      # Raspberry Pi OS release stops shipping the services that read them.
      - name: Check the image honours the flashers' first-boot files
        env:
          IMG: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          r=/tmp/fbroot
          sudo mkdir -p "$r"
          dev="$(sudo losetup -fP --show "$IMG")"
          sudo mount -o ro "${dev}p2" "$r"
          rc=0
          for unit in userconfig.service sshswitch.service; do
            # The wants/ entries are absolute symlinks, so test the link itself.
          if [[ -L "$r/etc/systemd/system/multi-user.target.wants/$unit" ]]; then
              echo "OK: $unit is enabled in the image"
            else
              echo "::error::$unit is not enabled in the image; the ssh/userconf.txt files written by host/flash.* would be ignored"
              rc=1
            fi
          done
          sudo umount "$r"
          sudo losetup -d "$dev"
          exit "$rc"

      # pinspawn-action needs systemd-container, qemu-user-static and
      # binfmt-support, and skips its own apt install when they are present.
      # apt-get resolves them against the runner's current packages (a .deb
      # cache keyed on env.ImageOS was always "X64--": the env context only
      # holds the workflow's own variables, so it went stale), and the check
      # stops here, not deep inside pinspawn, when arm64 emulation is missing.
      - name: Install nspawn host packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq systemd-container qemu-user-static binfmt-support
          # qemu-user-static registers its handlers through systemd-binfmt.
          sudo systemctl restart systemd-binfmt || true
          [[ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]] || sudo update-binfmts --enable qemu-aarch64
          [[ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]] || { echo '::error::arm64 emulation (qemu-aarch64 binfmt) is not registered'; exit 1; }

      - name: Provision tasks in booted container
        uses: ethanjli/pinspawn-action@ff063750a0e85cf96bd513df9134c27d31899285
        with:
          image: ${{ steps.image.outputs.image }}
          shell: bash
          boot: true
          user: root
          args: --bind ${{ github.workspace }}:/workspace
          run: |
            set -euo pipefail
            cd /workspace
            PROVISION_PROFILE=container-${{ matrix.group }} bash ci/provision.sh /workspace

      # ci/provision.sh writes the guest's journal, service status and logs to
      # <workdir>/ci-logs on failure; /workspace is the bind-mounted checkout.
      - name: Upload guest logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provision-gate-logs-${{ matrix.release }}-${{ matrix.group }}
          path: ci-logs/
          retention-days: 7

  provision-qemu:
    name: Provision tasks in QEMU VM (manual)
    runs-on: ubuntu-latest
    needs: [syntax, unit]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # piqemu-action can only boot Bookworm (its DTB build is Bookworm-specific).
      - name: Prepare Raspberry Pi OS image
        id: image
        uses: ./.github/actions/prepare-image
        with:
          version: bookworm

      - name: Copy repository into image
        env:
          IMG: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          sudo mkdir -p /tmp/rpi-root
          dev="$(sudo losetup -fP --show "$IMG")"
          sudo mount "${dev}p2" /tmp/rpi-root
          sudo mkdir -p /tmp/rpi-root/opt
          sudo cp -a "$GITHUB_WORKSPACE" /tmp/rpi-root/opt/rpi-setup
          sudo chown -R root:root /tmp/rpi-root/opt/rpi-setup
          sudo umount /tmp/rpi-root
          sudo losetup -d "$dev"

      - name: Provision tasks in QEMU VM
        id: qemu
        uses: ethanjli/piqemu-action@e5583ccf2ecf06ef869dd102a01909d887d96b11
        with:
          image: ${{ steps.image.outputs.image }}
          machine: rpi-3b+
          shell: bash
          run: |
            set -euo pipefail
            PROVISION_PROFILE=full bash ci/provision.sh /opt/rpi-setup

      # QEMU has no bind mount, so pull the guest's ci-logs back out of the
      # image after the VM has shut down.
      - name: Extract guest logs from image
        if: failure() && steps.qemu.outcome == 'failure'
        env:
          IMG: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-logs"
          sudo mkdir -p /tmp/rpi-root
          dev="$(sudo losetup -fP --show "$IMG")"
          sudo mount "${dev}p2" /tmp/rpi-root
          if [[ -d /tmp/rpi-root/opt/rpi-setup/ci-logs ]]; then
            sudo cp -a /tmp/rpi-root/opt/rpi-setup/ci-logs/. "$RUNNER_TEMP/ci-logs/"
          else
            echo "No ci-logs directory found in the guest image" | tee "$RUNNER_TEMP/ci-logs/missing.txt"
          fi
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ci-logs"
          sudo umount /tmp/rpi-root
          sudo losetup -d "$dev"

      - name: Upload guest logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provision-qemu-logs
          path: ${{ runner.temp }}/ci-logs/
          retention-days: 7

  # One check that sums up every job above, for branch protection: it fails
  # when any job failed or was cancelled and passes when they passed or were
  # skipped on purpose.
  result:
    name: Virtual Testing Environment
    runs-on: ubuntu-latest
    needs: [syntax, unit, docker-smoke, container-helpers, container-smoke, changes, provision-gate, provision-qemu]
    if: always()
    steps:
      - name: Fail when a job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
